<!DOCTYPE html>
<html>
  <head>
    <title>Paper Analyzer</title>
    <style>
      body {
        width: 380px;
        margin: 0;
        padding: 14px;
        font-family: Arial, sans-serif;
        color: #222;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 6px;
      }
      .sub {
        font-size: 12px;
        color: #666;
        margin-bottom: 12px;
      }
      .field {
        margin: 0 0 12px;
        padding: 10px;
        border: 1px solid #e0e0e0;
        border-radius: 6px;
        background: #fafafa;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .field-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .field input[type="number"] {
        width: 90px;
        padding: 6px 8px;
        border: 1px solid #bbb;
        border-radius: 4px;
        font-size: 13px;
      }
      .field .hint {
        font-size: 11px;
        color: #666;
        margin-top: 4px;
      }
      .presets {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .presets button {
        flex: 1;
        margin: 0;
        padding: 7px 6px;
        font-size: 11px;
      }
      button, label.file-btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 8px;
        padding: 9px 10px;
        border-radius: 6px;
        border: 1px solid #bbb;
        background: #f5f5f5;
        font-size: 13px;
        cursor: pointer;
        text-align: center;
      }
      button.primary {
        background: #2e7d32;
        border-color: #1b5e20;
        color: #fff;
        font-weight: 600;
      }
      button:hover, label.file-btn:hover { filter: brightness(0.97); }
      #status {
        font-size: 12px;
        color: #444;
        min-height: 16px;
        margin-top: 4px;
      }
      .warn {
        font-size: 11px;
        color: #8a4b00;
        background: #fff8e1;
        border: 1px solid #ffe082;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 12px;
      }
      input[type="file"] { display: none; }
    </style>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Paper Analyzer</h1>
    <div class="sub">Open on a Google Scholar citations profile to manage fetches.</div>

    <div class="warn">
      If you’re blocked: stop, wait 30–60 minutes, use <b>Paranoid</b> or <b>Safe</b>,
      and fetch only small batches (3–5 papers).
    </div>

    <div class="field">
      <label>Rate-limit presets</label>
      <div class="presets">
        <button type="button" id="presetSafe">Safe</button>
        <button type="button" id="presetParanoid">Paranoid</button>
        <button type="button" id="presetNormal">Normal</button>
      </div>

      <label for="fetchDelaySec">Delay between papers</label>
      <div class="field-row">
        <input id="fetchDelaySec" type="number" min="0" step="0.5" value="8" />
        <span style="font-size:12px;">seconds</span>
      </div>

      <label for="cooldownMin">Cooldown after rate limit</label>
      <div class="field-row">
        <input id="cooldownMin" type="number" min="0" step="1" value="10" />
        <span style="font-size:12px;">minutes</span>
      </div>

      <label for="batchSize">Papers per batch (then cooldown)</label>
      <div class="field-row">
        <input id="batchSize" type="number" min="0" step="1" value="5" />
        <span style="font-size:12px;">0 = no batch cap</span>
      </div>

      <button id="saveDelayBtn" type="button">Save pacing settings</button>
      <div class="hint">Default is now Safe: 8s delay, 10 min cooldown, batch of 5.</div>
    </div>

    <button id="openBtn" class="primary">Open workspace on page</button>
    <button id="scanFetchBtn">Scan page &amp; select missing</button>

    <label class="file-btn" for="jsonFile">Load professor JSON…</label>
    <input id="jsonFile" type="file" accept="application/json,.json" />

    <div id="status"></div>
  </body>
</html>
